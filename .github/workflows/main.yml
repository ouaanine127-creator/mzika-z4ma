name: ECLIPSE Android Build

on:
workflow_dispatch:
push:
paths:
- 'ECLIPSE-Android-Project.zip'
- '.github/workflows/main.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract project
    run: unzip -o ECLIPSE-Android-Project.zip -d extracted

  - name: Locate Android project
    run: |
      find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

  - name: Build debug APK
    run: |
      cd extracted
      PROJECT_DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
      test -n "$PROJECT_DIR"
      cd "$(dirname "$PROJECT_DIR")"
      gradle assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: ECLIPSE-debug-APK
      path: extracted/**/*.apk
      if-no-files-found: error
