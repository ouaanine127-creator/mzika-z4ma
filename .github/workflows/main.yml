name: ECLIPSE Android Build

on:
workflow_dispatch:
push:
paths:
- 'ECLIPSE-Android-Project.zip'
- '.github/workflows/main.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract project ZIP
    run: |
      unzip -o ECLIPSE-Android-Project.zip -d extracted
      find extracted -maxdepth 4 -type f | head -100

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build debug APK
    run: |
      cd extracted
      PROJECT_DIR="$(find . -name settings.gradle.kts -o -name settings.gradle | head -1)"
      test -n "$PROJECT_DIR"
      cd "$(dirname "$PROJECT_DIR")"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ECLIPSE-debug-APK
      path: extracted/**/*.apk
      if-no-files-found: error
